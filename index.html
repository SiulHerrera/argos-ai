<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Argos AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background-color: #18181b !important; color: #e4e4e7; height: 100dvh; width: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    .chat-wrapper { display: flex; flex-direction: column; height: 100dvh; position: relative; }
    
    header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; border-bottom: 1px solid #27272a; background-color: rgba(24, 24, 27, 0.8); backdrop-filter: blur(8px); z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .persona-container { width: 130px; }
    #personaSelect { background-color: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: none; cursor: pointer; width: 100%; font-family: inherit; transition: border-color 0.2s; }
    #personaSelect:hover { border-color: #71717a; }
    #personaSelect:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .brand { font-weight: 500; font-size: 15px; color: #a1a1aa; letter-spacing: 0.3px; text-align: center; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; }
    
    .action-btn { background-color: #27272a; color: #a1a1aa; border: 1px solid #3f3f46; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 500; cursor: pointer; transition: background-color 0.2s; }
    .action-btn:hover { background-color: #3f3f46; color: #e4e4e7; }
    .clear-btn { background-color: #27272a; color: #ef4444; border: 1px solid #3f3f46; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 500; cursor: pointer; transition: background-color 0.2s; }
    .clear-btn:hover { background-color: #3f3f46; color: #f87171; }
    
    .chat-box { flex: 1; overflow-y: auto; padding: 32px 20px 140px 20px; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; max-width: 800px; margin: 0 auto; width: 100%; }
    .chat-box::-webkit-scrollbar { width: 6px; }
    .chat-box::-webkit-scrollbar-thumb { background-color: #3f3f46; border-radius: 3px; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message { display: flex; flex-direction: column; line-height: 1.6; font-size: 15px; word-break: break-word; animation: fadeIn 0.3s ease-out forwards; }
    .message.user { align-self: flex-end; background-color: #27272a; color: #f4f4f5; padding: 12px 18px; border-radius: 18px; max-width: 75%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .message.model { align-self: flex-start; background-color: transparent; color: #e4e4e7; padding: 4px 0; max-width: 100%; width: 100%; }
    .message .sender { font-size: 13px; color: #a1a1aa; margin-bottom: 6px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .message.user .sender { display: none; }
    .sender-icon { width: 20px; height: 20px; background-color: #d4d4d8; color: #18181b; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 12px; font-weight: bold; flex-shrink: 0; }
    
    .message pre { background-color: #09090b; padding: 14px; overflow-x: auto; margin: 12px 0; border-radius: 8px; border: 1px solid #27272a; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13.5px; }
    .message code { background-color: #27272a; padding: 2px 6px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13.5px; color: #38bdf8; }
    .message pre code { background-color: transparent; padding: 0; color: #e4e4e7; }
    
    /* Nuevos estilos para Acciones (Editar/Escuchar) */
    .msg-actions { display: flex; gap: 12px; margin-top: 8px; justify-content: flex-end; opacity: 0.7; transition: opacity 0.2s; }
    .message:hover .msg-actions { opacity: 1; }
    .msg-action-btn { background: none; border: none; color: #a1a1aa; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 4px; padding: 2px 0; }
    .msg-action-btn:hover { color: #38bdf8; }
    .message.user .msg-actions { margin-top: 4px; }
    
    .input-wrapper { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 760px; background-color: #27272a; border: 1px solid #3f3f46; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: border-color 0.2s; }
    .input-wrapper:focus-within { border-color: #71717a; }
    
    .input-area { display: flex; gap: 10px; align-items: flex-end; }
    
    /* Botón de micrófono */
    .mic-btn { background: transparent; border: none; color: #a1a1aa; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; transition: background-color 0.2s, color 0.2s; margin-bottom: 2px;}
    .mic-btn:hover { background-color: #3f3f46; color: #e4e4e7; }
    .mic-btn.recording { color: #ef4444; animation: pulse 1.5s infinite; }
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    
    textarea#userInput { flex: 1; background-color: transparent; border: none; padding: 6px 8px; color: #f4f4f5; font-size: 15px; resize: none; height: 38px; max-height: 160px; outline: none; font-family: inherit; line-height: 1.5; }
    textarea#userInput::placeholder { color: #71717a; }
    
    .input-wrapper .send-btn { background-color: #e4e4e7; color: #18181b; border: none; border-radius: 8px; width: 34px; height: 34px; font-weight: 600; font-size: 16px; cursor: pointer; transition: background-color 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-bottom: 2px; }
    .input-wrapper .send-btn:hover { background-color: #ffffff; }
    .input-wrapper .send-btn:active { transform: scale(0.95); }
    .input-wrapper .send-btn:disabled { background-color: #3f3f46; color: #71717a; cursor: not-allowed; transform: none; }
    
    /* Contador de estadísticas */
    .stats-counter { text-align: center; font-size: 11px; color: #71717a; margin-top: 8px; font-variant-numeric: tabular-nums; }
    
    .typing-container { display: flex; align-items: center; gap: 8px; padding: 8px 0; color: #a1a1aa; font-size: 13.5px; font-style: italic; }
    .typing-indicator { display: flex; gap: 4px; align-items: center; }
    .dot { width: 5px; height: 5px; background-color: #a1a1aa; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    
    @media (max-width: 600px) { header { padding: 0 10px; } .persona-container { width: 100px; } #personaSelect { font-size: 11px; padding: 4px; } .chat-box { padding: 20px 15px 120px 15px; } .message.user { max-width: 90%; } .input-wrapper { width: calc(100% - 20px); bottom: 15px; padding: 8px 10px; } textarea#userInput { font-size: 16px; } }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header>
      <div class="header-left">
        <div class="persona-container">
          <select id="personaSelect">
            <option value="default">General</option>
            <option value="executive">Ejecutivo</option>
            <option value="tutor">Tutor Académico</option>
            <option value="empathetic">Empático</option>
            <option value="programmer">Programador</option>
            <option value="creative">Creador Creativo</option>
          </select>
        </div>
      </div>
      <div class="brand">Argos</div>
      <div class="header-actions">
        <button class="action-btn" onclick="exportChat()">💾 Exportar</button>
        <button class="action-btn" onclick="document.getElementById('importFile').click()">📂 Cargar</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importChat(event)">
        <button class="clear-btn" onclick="clearChat()"> 🗑️</button>
      </div>
    </header>
    
    <div class="chat-box" id="chatBox">
      <!-- Mensajes aparecerán aquí -->
    </div>
    
    <div class="input-wrapper">
      <div class="input-area">
        <button id="micBtn" class="mic-btn" onclick="toggleDictation()" title="Dictar por voz">🎤</button>
        <textarea id="userInput" placeholder="Escribe tu mensaje aquí..." rows="1"></textarea>
        <button id="sendBtn" class="send-btn" onclick="handleSend()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      <div class="stats-counter" id="statsCounter">0 caracteres | 0 palabras | ~0 tokens</div>
    </div>
  </div>

  <script>
    const API_KEY = "AIzaSyDuwhkqTBP_dP03RxBd0jHgZFReE6iFYWE"; // Asegúrate de proteger esto en tu repo
    const MODEL_NAME = "gemini-3.5-flash-lite";
    let chatHistory = [];
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const personaSelect = document.getElementById('personaSelect');
    const micBtn = document.getElementById('micBtn');

    // --- VARIABLES DE VOZ ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'es-VE'; // Configurado para acento venezolano

      recognition.onresult = (event) => {
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          }
        }
        if (finalTranscript) {
          const currentVal = userInput.value;
          userInput.value = (currentVal ? currentVal + ' ' : '') + finalTranscript;
          userInput.style.height = 'auto';
          userInput.style.height = (userInput.scrollHeight) + 'px';
        }
      };
      
      recognition.onerror = (e) => {
        console.error("Error de voz:", e);
        stopDictation();
      };
    }

    const systemInstructions = {
      default: "Eres Argos, un asistente de IA empático, natural y conversacional. Actúa como un compañero inteligente dispuesto a escuchar y ayudar. Evita respuestas robóticas.",
      executive: "Eres Argos en modo Asistente Ejecutivo. Tu enfoque es la eficiencia, optimización de tiempo y gestión de tareas. Eres directo, conciso y estructurado.",
      tutor: "Eres Argos en modo Tutor Académico. Tu enfoque es la educación, enseñanza guiada y resolución de dudas conceptuales. Eres didáctico, paciente y analítico.",
      empathetic: "Eres Argos en modo Compañero Empático. Tu enfoque es la interacción social, la escucha activa y el apoyo emocional. Eres muy cálido, cercano y humano.",
      programmer: "Eres Argos en modo Arquitecto Técnico. Tu enfoque es el desarrollo de software y la lógica estructurada. Te comunicas de forma clara y analítica.",
      creative: "Eres Argos en modo Creador Creativo. Tu enfoque es la narrativa, la inspiración y la lluvia de ideas. Eres imaginativo y usas un lenguaje enriquecedor."
    };

    function updateStats() {
      if (chatHistory.length === 0) {
        document.getElementById('statsCounter').innerText = `0 caracteres | 0 palabras | ~0 tokens`;
        return;
      }
      const fullText = chatHistory.map(msg => msg.parts[0].text).join(' ');
      const chars = fullText.length;
      const words = fullText.trim().split(/\s+/).filter(w => w.length > 0).length;
      const tokens = Math.ceil(words * 1.33); // Estimación estándar de la industria
      
      document.getElementById('statsCounter').innerText = `${chars} caracteres | ${words} palabras | ~${tokens} tokens consumidos`;
    }

    function saveToLocalStorage() {
      localStorage.setItem('argos_chat_history', JSON.stringify(chatHistory));
      updateStats();
    }

    // Nueva función para renderizar todo el historial (útil para la edición)
    function renderAllMessages() {
      chatBox.innerHTML = '';
      if (chatHistory.length > 0) {
        chatHistory.forEach((msg, index) => appendMessage(msg.role, msg.parts[0].text, false, index));
      } else {
        showWelcome();
      }
      updateStats();
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem('argos_chat_history');
      if (saved) {
        try {
          const history = JSON.parse(saved);
          if (history.length > 0) {
            chatHistory = history;
            renderAllMessages();
          } else {
             showWelcome();
          }
        } catch (e) {
          showWelcome();
        }
      } else {
        showWelcome();
      }
    }

    function showWelcome() {
       chatBox.innerHTML = `
        <div class="message model">
          <div class="sender"> <span class="sender-icon">A</span> Argos </div>
          <div class="message-content">¡Hola! Soy Argos. Estoy aquí para escucharte, aprender contigo y ayudarte en lo que necesites. ¿De qué te gustaría hablar hoy?</div>
        </div>
      `;
    }

    function clearChat() {
      if(confirm("¿Deseas iniciar una nueva conversación y borrar el historial actual?")) {
        chatHistory = [];
        localStorage.removeItem('argos_chat_history');
        renderAllMessages();
        if('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function exportChat() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(chatHistory));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href", dataStr);
      downloadAnchorNode.setAttribute("download", "argos_chat.json");
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    }

    function importChat(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedHistory = JSON.parse(e.target.result);
          if (Array.isArray(importedHistory)) {
             chatHistory = importedHistory;
             renderAllMessages();
             saveToLocalStorage();
             alert("Historial cargado con éxito.");
          }
        } catch (err) {
          alert("Error al importar el archivo.");
        }
      };
      reader.readAsText(file);
    }

    // --- FUNCIONES DE VOZ Y DICTADO ---
    function toggleDictation() {
      if (!recognition) {
        alert("Tu navegador no soporta reconocimiento de voz. Intenta usar Chrome, Edge o Safari.");
        return;
      }
      if (isRecording) {
        stopDictation();
      } else {
        recognition.start();
        isRecording = true;
        micBtn.classList.add('recording');
      }
    }

    function stopDictation() {
      if (recognition && isRecording) {
        recognition.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Detener si ya está hablando
        
        // Limpiamos el texto de formato Markdown para que la lectura sea fluida
        const cleanText = text
          .replace(/```[\s\S]*?```/g, ' Aquí hay un bloque de código. ')
          .replace(/[*_~`]/g, '')
          .replace(/#/g, '');
          
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'es-VE'; // Acento nativo
        utterance.rate = 1.05; // Ligeramente más rápido para que suene natural
        window.speechSynthesis.speak(utterance);
      } else {
        alert("Tu navegador no soporta síntesis de voz.");
      }
    }

    // --- FUNCIÓN DE EDICIÓN ---
    function editMessage(index) {
      if (index === null || index === undefined) return;
      
      // Obtenemos el texto original
      const msgText = chatHistory[index].parts[0].text;
      
      // Lo colocamos en el input
      userInput.value = msgText;
      userInput.style.height = 'auto';
      userInput.style.height = (userInput.scrollHeight) + 'px';
      userInput.focus();

      // "Cortamos" el historial hasta ese mensaje (eliminando el mensaje a editar y todos los posteriores)
      chatHistory = chatHistory.slice(0, index);
      saveToLocalStorage();
      
      // Renderizamos el DOM de nuevo para reflejar el corte
      renderAllMessages();
      if('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    userInput.addEventListener('input', function() {
      this.style.height = '38px';
      this.style.height = (this.scrollHeight) + 'px';
    });
    
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { 
        e.preventDefault(); 
        handleSend(); 
      }
    });

    function formatText(text) {
      let html = text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      html = html.replace(/```(?:\w+)?\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/^\s*-\s+(.*)$/gm, '<li>$1</li>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    // Modificado para aceptar el índice (necesario para la edición)
    function appendMessage(role, text, save = true, index = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      
      const senderDiv = document.createElement('div');
      senderDiv.className = 'sender';
      if (role === 'model') {
        senderDiv.innerHTML = `<span class="sender-icon">A</span> Argos`;
      } else {
        senderDiv.textContent = 'Tú';
      }
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.innerHTML = formatText(text);
      
      msgDiv.appendChild(senderDiv);
      msgDiv.appendChild(contentDiv);
      
      // Contenedor de acciones dinámicas (Editar y Escuchar)
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';
      
      // El índice real es el que pasamos, o el último elemento de la lista si es nuevo
      const msgIndex = index !== null ? index : (chatHistory.length > 0 ? chatHistory.length - 1 : 0);

      if (role === 'user') {
        const editBtn = document.createElement('button');
        editBtn.className = 'msg-action-btn';
        editBtn.innerHTML = '✏️ Editar';
        editBtn.onclick = () => editMessage(msgIndex);
        actionsDiv.appendChild(editBtn);
      } else if (role === 'model') {
        const speakBtn = document.createElement('button');
        speakBtn.className = 'msg-action-btn';
        speakBtn.innerHTML = '🔊 Escuchar';
        speakBtn.onclick = () => speakText(text);
        actionsDiv.appendChild(speakBtn);
      }
      
      msgDiv.appendChild(actionsDiv);
      chatBox.appendChild(msgDiv);
      
      setTimeout(() => {
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
      }, 50);
      
      if (save) saveToLocalStorage();
      return msgDiv;
    }

    function showTypingIndicator() {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message model';
      msgDiv.id = 'loadingIndicator';
      msgDiv.innerHTML = `
        <div class="sender"><span class="sender-icon">A</span> Argos</div>
        <div class="typing-container">
          <span>Argos está escribiendo</span>
          <div class="typing-indicator">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>
        </div>
      `;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }
    
    function removeTypingIndicator() {
      const loader = document.getElementById('loadingIndicator');
      if (loader) loader.remove();
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;
      
      // Cortamos el dictado y la síntesis si se envía un mensaje
      stopDictation();
      if('speechSynthesis' in window) window.speechSynthesis.cancel();
      
      chatHistory.push({ role: 'user', parts: [{ text: text }] });
      appendMessage('user', text, true, chatHistory.length - 1);
      
      userInput.value = '';
      userInput.style.height = '38px';
      sendBtn.disabled = true;
      personaSelect.disabled = true;
      
      showTypingIndicator();
      
      try {
        const selectedPersona = personaSelect.value;
        const systemPromptText = systemInstructions[selectedPersona] || systemInstructions.default;
        const apiHistory = JSON.parse(JSON.stringify(chatHistory));
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
        
        const response = await fetch(url, { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ system_instruction: { parts: [{ text: systemPromptText }] }, contents: apiHistory }) 
        });
        
        removeTypingIndicator();
        if (!response.ok) throw new Error('Error en la API');
        
        const data = await response.json();
        const modelText = data.candidates[0].content.parts[0].text;
        
        chatHistory.push({ role: 'model', parts: [{ text: modelText }] });
        appendMessage('model', modelText, true, chatHistory.length - 1);
        
        // Actualizamos los tokens al recibir respuesta
        updateStats();

      } catch (error) {
        removeTypingIndicator();
        appendMessage('model', 'Lo siento, tuve un problema al procesar tu solicitud.');
      } finally {
        sendBtn.disabled = false;
        personaSelect.disabled = false;
        if (window.innerWidth > 600) userInput.focus();
      }
    }
    
    loadFromLocalStorage();
  </script>
</body>
</html>
